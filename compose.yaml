name: ai-writing-coach

services:
  writing-coach:
    build: .
    image: ai-writing-coach:local
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      WRITING_DB: /data/writing.db
      ALLOW_FALLBACK: ${ALLOW_FALLBACK:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_ENV: ${APP_ENV:-development}
      APP_BIND_HOST: ${APP_BIND_HOST:-0.0.0.0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      AUTH_DB: /data/auth.db
      USER_DATA_ROOT: /data/users
      PLATFORM_DB: /data/platform.db
      PRODUCT_DB: /data/product.db
      POSTGRES_SHADOW_URL: ${POSTGRES_SHADOW_URL:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODELS: ${DEEPSEEK_MODELS:-deepseek-v4-flash,deepseek-v4-pro}
      CLOUD_AI_TIMEOUT: ${CLOUD_AI_TIMEOUT:-180}
    volumes:
      - writing_data:/data
      - ./app.py:/app/app.py:ro
      - ./auth_support.py:/app/auth_support.py:ro
      - ./grammar_course.py:/app/grammar_course.py:ro
      - ./writing_coach:/app/writing_coach:ro
      - ./VERSION:/app/VERSION:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-becoming}
      POSTGRES_USER: ${POSTGRES_USER:-becoming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-becoming-local-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-becoming} -d $${POSTGRES_DB:-becoming}"]
      interval: 5s
      timeout: 3s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - writing-coach

volumes:
  writing_data:
    name: ai-writing-coach-data
  postgres_data:
    name: ai-writing-coach-postgres-data

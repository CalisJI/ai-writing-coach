  <meta name="theme-color" content="#F7F7F5">
  <title>BECOMING</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('becoming.theme.v1');
        const theme = saved === 'dark' || saved === 'light' ? saved : 'light';
        const palette = localStorage.getItem('becoming.palette.v1') || 'editorial';
        const uiLocale = localStorage.getItem('becoming.support-language.v1') || 'vi';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = palette;
        document.documentElement.lang = uiLocale === 'zh' ? 'zh-Hans' : uiLocale;
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.palette = 'editorial';
      }
    })();
  </script>

        </button>

    <section class="app-workspace">
      <header class="app-header">
        <div class="workspace-quiet-mark" aria-hidden="true"><span></span></div>
        <div class="header-actions">
          <label class="learning-language-control" for="languageSelect">
            <span class="utility-label" data-learning-language-label>Learning language</span>
            <select id="languageSelect" class="language-select" aria-label="Learning language">
              <option value="">Loading…</option>
            </select>
          </label>

          <button id="themeButton" class="theme-button physical-control" type="button" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.7 8.7 0 1 0 20 15.5Z"/></svg>
            <span class="sr-only">Toggle theme</span>
          </button>
        </div>
      </header>

      <main id="mainContent" class="main-content" tabindex="-1"></main>
    </section>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <div id="accountMenu" class="account-menu hidden" role="menu">
      <div class="account-menu-meta">
        <strong id="accountMenuName">Account</strong>
        <span id="accountMenuEmail"></span>
      </div>
      <button type="button" data-account-action="switch" role="menuitem">Switch account</button>
      <button type="button" data-account-action="logout" role="menuitem">Sign out</button>
    </div>

    <div id="dialogBackdrop" class="dialog-backdrop hidden" aria-hidden="true">
      <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
